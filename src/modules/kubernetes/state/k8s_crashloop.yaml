cluster:
  name: cluster-1
  nodes:
    - name: node-1
      ip: 10.244.0.5
      pods:
        - name: backend
          status: CrashLoopBackOff
          restarts: 5
          image: my-backend-image:v1
          container_state: waiting
          last_state:
            reason: Error
            exit_code: 1
            started: "2025-10-24T14:00:00"
            finished: "2025-10-24T14:00:01"
          events:
            - type: Warning
              reason: Failed
              message: "Error: secret 'db-secret' not found"
              timestamp: "2025-10-24T14:00:01"
            - type: Normal
              reason: Pulling
              message: Pulling image "my-backend-image:v1"
              timestamp: "2025-10-24T14:01:01"
            - type: Warning
              reason: BackOff
              message: Back-off restarting failed container
              timestamp: "2025-10-24T14:01:30"
          logs:
            - timestamp: "2025-10-24T14:00:01"
              message: "Error: cannot connect to database - missing credentials"
            - timestamp: "2025-10-24T14:02:15"
              message: "Retrying connection to database..."
            - timestamp: "2025-10-24T14:04:30"
              message: "Fatal: DATABASE_URL environment variable not configured"

    - name: node-2
      ip: 10.244.0.6
      pods:
        - name: frontend
          status: Running
          restarts: 0
          image: nginx:latest
          container_state: running
          logs:
            - timestamp: "2025-10-24T14:05:00"
              message: "Started nginx"
          events: []

  # Secrets in the cluster (db-secret is missing!)
  secrets:
    - name: frontend-secret
      type: Opaque
      age: "10d"
      data:
        api_key: "frontend-api-key-value"

# Simulation: Describes the ongoing crash cycle in this broken state
simulation:
  enabled: true
  tick_rate: 10

  rules:
    - name: "crashloop_restart_cycle"
      trigger:
        type: interval
        every: 8s
      conditions:
        - type: pod_status
          pod: backend
          status: CrashLoopBackOff
      actions:
        - type: increment_restarts
          pod: backend
          max: 999

        - type: add_event
          pod: backend
          event:
            type: Warning
            reason: BackOff
            message: "Back-off restarting failed container"

    - name: "crashloop_error_logs"
      trigger:
        type: interval
        every: 2s
      conditions:
        - type: pod_status
          pod: backend
          status: CrashLoopBackOff
      actions:
        - type: cycle_logs
          pod: backend
          messages:
            - "Backend service initializing..."
            - "Loading configuration..."
            - "Attempting to connect to database..."
            - "ERROR: Failed to load database credentials"
            - "ERROR: Secret 'db-secret' not found"
            - "FATAL: Cannot start without database access"
            - "[Container Exit Code: 1]"