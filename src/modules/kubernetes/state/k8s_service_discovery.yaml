cluster:
  name: prod-cluster
  nodes:
    - name: worker-1
      ip: 10.244.0.10
      pods:
        - name: web-pod
          status: Running
          restarts: 0
          image: web-frontend:v1
          container_state: running
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "Web frontend started"
            - timestamp: "2025-11-11T10:01:00"
              message: "Attempting to connect to api service..."
            - timestamp: "2025-11-11T10:01:01"
              message: "ERROR: Connection refused to api:8080"
            - timestamp: "2025-11-11T10:01:05"
              message: "ERROR: Cannot resolve api service - no endpoints found"
          events: []

        - name: api-7f8d9c-xk2mp
          status: Running
          restarts: 0
          image: api-server:v1
          container_state: running
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "API server listening on port 8080"
          events: []

  secrets: []
  configmaps: []
  deployments:
    - name: api
      replicas: 1
      ready_replicas: 1
      available_replicas: 1
      image: api-server:v1
      age: "1h"
      labels:
        app: api-server
        version: v1
  services:
    - name: api
      type: ClusterIP
      cluster_ip: 10.96.0.50
      external_ip: "<none>"
      ports:
        - "8080:8080/TCP"
      age: "1h"
      selector:
        app: api
        tier: backend
