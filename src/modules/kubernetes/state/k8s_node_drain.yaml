cluster:
  name: production-cluster
  nodes:
    - name: worker-1
      ip: 10.244.0.10
      pods:
        - name: api-1
          status: Running
          restarts: 0
          image: api:v1
          container_state: running
          logs: []
          events: []

    - name: worker-2
      ip: 10.244.0.11
      pods:
        - name: database-primary
          status: Running
          restarts: 0
          image: postgres:14
          container_state: running
          logs:
            - timestamp: "2025-11-11T09:00:00"
              message: "Database accepting connections"
          events: []

        - name: worker-job-1
          status: Running
          restarts: 0
          image: batch-processor:v1
          container_state: running
          logs:
            - timestamp: "2025-11-11T09:30:00"
              message: "Processing batch job 1/100"
          events: []

        - name: cache-redis
          status: Running
          restarts: 0
          image: redis:6
          container_state: running
          logs: []
          events: []

    - name: worker-3
      ip: 10.244.0.12
      pods:
        - name: web-frontend
          status: Running
          restarts: 0
          image: nginx:latest
          container_state: running
          logs: []
          events: []

  secrets: []
  configmaps: []
  deployments:
    - name: database-primary
      replicas: 1
      ready_replicas: 1
      available_replicas: 1
      image: postgres:14
      age: "10d"

    - name: api
      replicas: 3
      ready_replicas: 1
      available_replicas: 1
      image: api:v1
      age: "5d"

  services: []
