cluster:
  name: prod-cluster
  nodes:
    - name: worker-1
      ip: 10.244.0.10
      pods:
        - name: redis-master
          status: Running
          restarts: 0
          image: redis:6
          container_state: running
          logs: []
          events: []

    - name: worker-2
      ip: 10.244.0.11
      pods: []

    - name: worker-3
      ip: 10.244.0.12
      pods:
        - name: cache
          status: Pending
          restarts: 0
          image: memcached:1.6
          container_state: waiting
          events:
            - type: Warning
              reason: FailedScheduling
              message: "0/3 nodes are available: 3 node(s) didn't match pod affinity rules"
              timestamp: "2025-11-11T10:00:00"
          logs: []

  secrets: []
  configmaps: []
  deployments:
    - name: cache
      replicas: 1
      ready_replicas: 0
      available_replicas: 0
      image: memcached:1.6
      age: "10m"
      affinity_type: "required"  # Too strict - needs to be "preferred" or fix node labels
  services: []
