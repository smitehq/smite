cluster:
  name: prod-cluster
  nodes:
    - name: worker-1
      ip: 10.244.0.10
      pods:
        - name: database-pod
          status: Pending
          restarts: 0
          image: postgres:14
          container_state: waiting
          events:
            - type: Warning
              reason: FailedMount
              message: "Unable to mount volumes: PersistentVolumeClaim 'database-pvc' is not bound"
              timestamp: "2025-11-11T10:00:00"
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "Waiting for persistent volume to be mounted..."

  secrets: []
  configmaps: []
  pvcs:
    - name: database-pvc
      status: Pending  # Needs to be Bound
      storage_request: "10Gi"
      storage_class: "standard"
      age: "5m"
  deployments: []
  services: []
