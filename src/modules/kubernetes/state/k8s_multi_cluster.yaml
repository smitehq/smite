cluster:
  name: prod-us-east
  nodes:
    - name: us-east-worker-1
      ip: 10.244.0.10
      pods:
        - name: payment-service-abc123
          status: Running
          restarts: 0
          image: payments/service:v2.1
          container_state: running
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "Payment service replica 1/10 started"
            - timestamp: "2025-11-11T10:00:05"
              message: "Processing payments in us-east-1 cluster"
          events: []

        - name: payment-service-def456
          status: Running
          restarts: 0
          image: payments/service:v2.1
          container_state: running
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "Payment service replica 2/10 started"
          events: []

    - name: us-east-worker-2
      ip: 10.244.0.11
      pods:
        - name: payment-service-ghi789
          status: Running
          restarts: 0
          image: payments/service:v2.1
          container_state: running
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "Payment service replica 3/10 started"
            - timestamp: "2025-11-11T10:00:05"
              message: "WARNING: Running 10 replicas (DR cluster has only 3!)"
            - timestamp: "2025-11-11T10:00:10"
              message: "WARNING: Clusters desynchronized - failover risk HIGH"
          events:
            - type: Warning
              reason: ClusterMismatch
              message: "Deployment scaled to 10 replicas, but DR has 3"
              timestamp: "2025-11-11T09:00:00"

  secrets: []
  configmaps:
    - name: cluster-info
      data:
        region: "us-east-1"
        environment: "production"
        cluster-name: "prod-us-east"
        dr-cluster: "prod-eu-west"
        dr-replicas-mismatch: "true"

  deployments:
    - name: payment-service
      replicas: 10
      ready_replicas: 10
      available_replicas: 10
      image: payments/service:v2.1
      labels:
        app: payments
        tier: backend

  services:
    - name: payment-service
      type: LoadBalancer
      cluster_ip: 10.96.0.100
      external_ip: "52.123.45.67"
      ports:
        - "443:8443/TCP"
      selector:
        app: payments
