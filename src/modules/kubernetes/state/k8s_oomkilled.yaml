cluster:
  name: prod-cluster
  nodes:
    - name: worker-1
      ip: 10.244.0.10
      pods:
        - name: worker
          status: CrashLoopBackOff
          restarts: 12
          image: memory-hog:v1
          container_state: waiting
          last_state:
            reason: OOMKilled
            exit_code: 137
            started: "2025-11-11T10:00:00"
            finished: "2025-11-11T10:00:15"
          events:
            - type: Warning
              reason: BackOff
              message: "Back-off restarting failed container"
              timestamp: "2025-11-11T10:05:00"
          logs:
            - timestamp: "2025-11-11T10:00:00"
              message: "Worker starting, loading large dataset into memory..."
            - timestamp: "2025-11-11T10:00:10"
              message: "Processing 10GB dataset..."
            - timestamp: "2025-11-11T10:00:14"
              message: "Memory usage: 248MB / 256MB"

  secrets: []
  configmaps: []
  deployments:
    - name: worker
      replicas: 1
      ready_replicas: 0
      available_replicas: 0
      image: memory-hog:v1
      age: "15m"
      memory_limit: "256Mi"  # Too low - needs at least 512Mi
  services: []

# Simulation: Describes the ongoing OOMKill cycle in this broken state
simulation:
  enabled: true
  tick_rate: 10

  rules:
    - name: "oomkill_restart_cycle"
      trigger:
        type: interval
        every: 10s
      conditions:
        - type: pod_status
          pod: worker
          status: CrashLoopBackOff
      actions:
        - type: increment_restarts
          pod: worker
          max: 999

        - type: add_event
          pod: worker
          event:
            type: Warning
            reason: BackOff
            message: "Back-off restarting failed container worker in pod worker"

    - name: "oomkill_log_progression"
      trigger:
        type: interval
        every: 2s
      conditions:
        - type: pod_status
          pod: worker
          status: CrashLoopBackOff
      actions:
        - type: cycle_logs
          pod: worker
          messages:
            - "Worker starting, loading large dataset into memory..."
            - "Allocating memory for data processing..."
            - "Processing 10GB dataset..."
            - "Memory usage: 220MB / 256MB"
            - "Memory usage: 248MB / 256MB"
            - "Memory usage: 255MB / 256MB [WARNING: Near limit!]"
            - "[KILLED - Out of Memory (exit code 137)]"
