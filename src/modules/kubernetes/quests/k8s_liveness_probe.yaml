id: k8s_liveness_probe
title: "The Probe of Life"
description: "Fix a failing liveness probe causing unnecessary restarts."
difficulty: advanced

intro_text: |
  The monitor pod lives in eternal torment - killed by something, restarted
  by the kubelet, only to be killed again moments later.

  The logs show it starts successfully. The application initializes. Metrics
  collectors spin up. Then... death. Over and over.

  Restart count: 47. Each restart a small death. Each death unnecessary.
  The pod never gets a chance to prove itself.

  You must investigate what keeps killing this healthy pod and stop the
  endless cycle of death and rebirth.

condition:
  type: deployment_liveness_probe
  deployment: monitor
  min_initial_delay: 10
  min_timeout: 3

reward_xp: 105

completion_message: |
  The liveness probe finally reports success! The pod lives, truly lives,
  without fear of being killed by overzealous health checks.

  REWARDS:
   * +105 Experience Points
   * Achievement Unlocked: "Health Check Expert"
   * Title Earned: "Probe Tuner"

  You've learned that health checks are a double-edged sword. Too strict
  and healthy pods die. Too lenient and sick pods linger.

hints:
  - "Check pod events with 'kubectl describe pod monitor'"
  - "Look for 'Liveness probe failed' messages"
  - "You need to edit the deployment's liveness probe settings"
  - "Increase initialDelaySeconds to give the app time to start"
  - "Adjust timeoutSeconds and failureThreshold to be more forgiving"
