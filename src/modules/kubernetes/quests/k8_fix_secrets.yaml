id: k8s_fix_secret
title: "Secret Retrieval"
description: "Ensure the backend pod can pull secrets correctly."
difficulty: intermediate

intro_text: |
  The vault lies sealed. The backend pod reaches desperately for the
  secrets it needs to survive, but its hands grasp only empty air.

  Access denied. Permissions insufficient. Hope fading.

  The secret exists, yet remains forever out of reach—a cruel torment
  for a pod that knows salvation lies just beyond its grasp.

  You must bridge the gap. Grant the pod its birthright. Unlock the
  vault of secrets and watch as the impossible becomes possible.

  The key to redemption awaits your command.

completion_message: |
  The vault EXPLODES open with your command! Permissions cascade through
  the cluster like lightning, and the backend pod grasps the secret it
  desperately needed!

  VAULT UNLOCKED! PERMISSIONS GRANTED! SECRET RETRIEVED!

  What was once forbidden is now accessible. The pod's prayers have been
  answered through your mastery of the Kubernetes arts!

  REWARDS:
     * Achievement Unlocked: "Vault Breaker"
     * Title Earned: "Master of Secrets"

  The secrets whisper your name with reverence. You have proven yourself
  worthy of the deepest truths hidden within the cluster.

condition:
  type: pod_event
  pod: backend
  reason: Failed
  message_contains: "secret"
reward_xp: 75
hints:
  - "Check if the secret 'db-secret' exists in the cluster."
  - "Verify that the backend pod has the correct permissions to access the secret." 