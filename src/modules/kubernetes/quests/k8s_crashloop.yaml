id: k8s_crashloop
title: "The Crashing Pod"
description: "Resolve the CrashLoopBackOff for the backend pod."

intro_text: |
  Deep within the Kubernetes cluster, chaos reigns. The backend pod writhes
  in an endless cycle of crashes, its container gasping for life before
  plunging back into darkness.

  The logs tell a tale of desperation: Each restart is a failed resurrection, 
  each attempt futile.

  The cluster trembles. Services fail. Users rage. Time is running out.

  Your mission: Uncover the missing secret.
  Break the curse of the CrashLoopBackOff before the entire system
  crumbles into digital oblivion.

  The pod's fate... is in your hands.

# Quest flow: Player must create the missing db-secret
# When db-secret is created, the pod will automatically recover
triggers:
  - type: resource_created
    resource: secret
    name: db-secret
    actions:
      - type: modify_pod
        pod: backend
        changes:
          status: Running
          restarts: 0
          container_state: running
      - type: clear_events
        pod: backend
      - type: add_event
        pod: backend
        event:
          type: Normal
          reason: Started
          message: "Started container backend-container"
          timestamp: "2025-11-08T13:00:00"
      - type: clear_logs
        pod: backend
      - type: add_log
        pod: backend
        log:
          timestamp: "2025-11-08T13:00:00"
          message: "Connecting to database..."
      - type: add_log
        pod: backend
        log:
          timestamp: "2025-11-08T13:00:05"
          message: "Database connection established"
      - type: add_log
        pod: backend
        log:
          timestamp: "2025-11-08T13:00:06"
          message: "Backend service started successfully"

condition:
  type: pod_status
  pod: backend
  status: Running

reward_xp: 100
reward_item: "golden_kubeconfig"

completion_message: |
  The backend pod springs back to life! Database credentials secured,
  connections restored, and the cluster is stable once more.

  Your debugging prowess has turned chaos into order.

  REWARDS:
   * Golden Kubeconfig (Legendary Artifact)
   * Achievement Unlocked: "Secret Keeper"
   * Title Earned: "Bane of CrashLoops"

  The cluster administrator bows deeply. "You wield kubectl like a weapon
  of legend," they whisper. "The gods of DevOps themselves would be proud."

  Your name will echo through the namespaces for generations to come.


hints:
  - "Check the pod's events to identify the root cause of the crash."
  - "Investigate the logs for error messages related to database connectivity."
  - "Ensure that the required secrets are correctly configured and accessible."
  - "List secrets with 'kubectl get secrets' to see what's available."

unlock_quests:
  - k8s_database_restore

milestone_bonus:
  xp_multiplier: 1.2
  message: "Bonus XP! You resolved the crash efficiently, earning a small mastery boost."
