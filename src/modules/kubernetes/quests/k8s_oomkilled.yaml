id: k8s_oomkilled
title: "Death by Memory"
description: "Rescue a pod that's being OOMKilled due to insufficient memory."
difficulty: intermediate

intro_text: |
  The worker pod gasps for breath, struggling to survive. It processes data
  for mere seconds before dying. Again. And again. And again.

  Exit code 137 repeats endlessly in the crash logs. The signature of
  something terrible. The pod never completes its work. Users see failures
  as their requests are lost mid-processing.

  The monitoring graphs show a pattern: start, spike, crash. Start, spike,
  crash. Like a heartbeat that never stabilizes.

  You must investigate why this pod cannot stay alive and fix the underlying
  issue before all pending work is lost.

condition:
  type: deployment_memory_limit
  deployment: worker
  min_limit: "512Mi"

reward_xp: 90

completion_message: |
  The worker pod takes a deep breath as memory floods its container!
  No longer does it live on the edge of death. It processes in peace.

  REWARDS:
   * +90 Experience Points
   * Achievement Unlocked: "Memory Guardian"
   * Title Earned: "Resource Optimizer"

  You've learned that pods need resources to survive - and you control
  their fate. Use your power wisely.

hints:
  - "Check the pod's status with 'kubectl describe pod worker'"
  - "Look for OOMKilled in the last state or events"
  - "You need to increase the memory limit in the deployment"
  - "Use 'kubectl edit deployment worker' to adjust resources"
  - "Set memory limits to at least 512Mi or more"
